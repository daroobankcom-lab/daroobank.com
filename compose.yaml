# Local development only. Set POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD in
# an uncommitted .env or the shell before starting; existing volumes retain their
# original credentials and are not reinitialized when environment values change.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  web:
    build: .
    environment:
      DAROOBANK_DEBUG: ${DAROOBANK_DEBUG:-1}
      DAROOBANK_SECRET_KEY: ${DAROOBANK_SECRET_KEY:?Set DAROOBANK_SECRET_KEY in your environment}
      DAROOBANK_ALLOWED_HOSTS: ${DAROOBANK_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DAROOBANK_HEALTH_PROBES_ENABLED: ${DAROOBANK_HEALTH_PROBES_ENABLED:-0}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
    restart: on-failure
volumes:
  postgres_data:
